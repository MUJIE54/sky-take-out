sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    # 改成你本机 MySQL 的密码
    password: root
  alioss:
    endpoint: oss-cn-wuhan.aliyuncs.com
    # 阿里云 OSS 的 AccessKey，请到阿里云控制台自行创建后填入
    access-key-id: <YOUR_ALIYUN_ACCESS_KEY_ID>
    access-key-secret: <YOUR_ALIYUN_ACCESS_KEY_SECRET>
    bucket-name: sky-take-out
  redis:
    host: localhost
    port: 6379
    # Redis 没有设置密码时改成 ""
    password: "123456"
    database: 10
  wechat:
    # 微信小程序 appid / secret，没有可保留占位符；后台管理端功能不受影响
    appid: <YOUR_WECHAT_APPID>
    secret: <YOUR_WECHAT_SECRET>
    mchid: <YOUR_MCH_ID>
    mchSerialNo: <YOUR_MCH_SERIAL_NO>
    privateKeyFilePath: C:/apiclient_key.pem
    apiV3Key: <YOUR_API_V3_KEY>
    weChatPayCertFilePath: C:/wechatpay_cert.pem
    notifyUrl: https://<YOUR_DOMAIN>/wxpay/pay.php
    refundNotifyUrl: https://<YOUR_DOMAIN>/wxpay/pay.php
